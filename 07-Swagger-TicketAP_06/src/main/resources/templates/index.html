<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h2>Ticket Booking System</h2>
    <h3>Passenger Registration Form</h3>

    <form th:action="@{/book-ticket}"
          th:object="${passenger}"
          method="post">

        <label>Passenger Name</label>
        <input type="text" th:field="*{name}"
               placeholder="Enter your name" required>

        <label>Departure</label>
        <input type="text" th:field="*{departure}"
               placeholder="Enter departure city" required>

        <label>Arrival</label>
        <input type="text" th:field="*{arrival}"
               placeholder="Enter arrival city" required>

        <label>Date Of Journey</label>
        <input type="date" th:field="*{dateOfJourney}" required>

        <button type="submit">Book Ticket</button>

    </form>

</div>

</body>
</html>
